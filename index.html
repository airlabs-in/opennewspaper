<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Open Newspaper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400;1,700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="paper-container" id="newspaper" aria-live="polite">
    <p class="loading-message">Loading today’s paper…</p>
  </div>
  <script>
    const escapeHtml = (value = '') => String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
    const safeUrl = value => {
      try { const url = new URL(value, window.location.href); return ['http:', 'https:'].includes(url.protocol) ? url.href : '#'; }
      catch { return '#'; }
    };
    const renderImage = (image, className = 'story-photo') => image ? `<figure class="${className}"><img${className === 'press-photo-container' ? ' class="newspaper-photo" width="1200" height="800" loading="eager"' : ' loading="lazy"'} src="${escapeHtml(safeUrl(image.src))}" alt="${escapeHtml(image.alt)}"><figcaption${className === 'press-photo-container' ? ' class="photo-caption"' : ''}>${image.captionHtml || escapeHtml(image.caption || '')}</figcaption></figure>` : '';
    const renderMore = url => url ? ` <a class="more-link" href="${escapeHtml(safeUrl(url))}" target="_blank" rel="noopener noreferrer">...more</a>` : '';

    function renderStory(story, options = {}) {
      const tag = story.tag || 'article';
      const storyId = options.storyId || '';
      const headline = story.headline ? `<${story.headlineTag || 'h4'} class="${escapeHtml(story.headlineClass || 'lower-headline')}">${escapeHtml(story.headline)}</${story.headlineTag || 'h4'}>` : '';
      const byline = story.source && story.headline ? `<p class="byline story-byline">BY ${escapeHtml(story.source)}</p>` : '';
      const kicker = story.kicker ? `<p class="section-kicker">${escapeHtml(story.kicker)}</p>` : '';
      const deck = story.deck ? `<p class="${options.deckClass || 'section-deck'}">${escapeHtml(story.deck)}</p>` : '';
      const subhead = story.subhead ? `<p class="${options.subheadClass || 'lower-subhead'}">${escapeHtml(story.subhead)}</p>` : '';
      const image = renderImage(story.image);
      const paragraphs = (story.paragraphs || []).map((paragraph, index) => `<p class="article-snippet">${escapeHtml(paragraph)}${index === story.paragraphs.length - 1 ? renderMore(story.moreUrl) : ''}</p>`).join('');
      let extra = '';
      if (story.table) {
        extra = `<div class="mini-data-table"><div class="table-row table-head">${story.table.headers.map(item => `<span>${escapeHtml(item)}</span>`).join('')}</div>${story.table.rows.map(row => `<div class="table-row">${row.map(item => `<span>${escapeHtml(item)}</span>`).join('')}</div>`).join('')}</div>`;
      }
      if (story.weather) {
        const weather = story.weather;
        extra = `<div class="weather-box">${renderImage(weather.image)}${weather.paragraphs.map(line => `<p>${escapeHtml(line)}</p>`).join('')}<p>${renderMore(weather.moreUrl)}</p></div>`;
      }
      if (story.listing) {
        extra = `<ul class="listing-list">${story.listing.map(([label, text]) => `<li><strong>${escapeHtml(label)}</strong><span>${escapeHtml(text)}</span></li>`).join('')}</ul>`;
      }
      return `<${tag} class="${escapeHtml(story.className || '')}"${storyId ? ` id="${escapeHtml(storyId)}" data-story-id="${escapeHtml(storyId)}"` : ''}${story.source ? ` data-source="${escapeHtml(story.source)}"` : ''}>${kicker}${headline}${byline}${deck}${subhead}${image}${paragraphs}${extra}</${tag}>`;
    }

    function renderPage(data) {
      const page = data.page;
      document.title = page.title;
      const usedStoryIds = new Map();
      const getStoryId = title => {
        if (!title) return '';
        const slug = title.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'news';
        const count = (usedStoryIds.get(slug) || 0) + 1;
        usedStoryIds.set(slug, count);
        return `story-${slug}${count > 1 ? `-${count}` : ''}`;
      };
      const lead = data.lead;
      const leadStoryId = getStoryId(lead.headline);
      const sidebarStory = data.sidebarStory;
      const leadParagraphs = lead.paragraphs.map((paragraph, index) => index === 0
        ? `<p class="lead-paragraph"><span class="dropcap">${escapeHtml(paragraph.charAt(0))}</span>${escapeHtml(paragraph.slice(1))}</p>`
        : `<p>${escapeHtml(paragraph)}${index === lead.paragraphs.length - 1 ? renderMore(lead.moreUrl) : ''}</p>`).join('');
      const indexItems = data.newsIndex.map(([topic, section]) => `<li><span>${escapeHtml(topic)}</span><strong>${escapeHtml(section)}</strong></li>`).join('');
      const groups = data.groups.map(group => {
        const sectionClass = escapeHtml(group.className);
        const ariaLabel = group.ariaLabel ? ` aria-label="${escapeHtml(group.ariaLabel)}"` : '';
        let sectionContent;
        if (group.className.startsWith('news-section')) {
          const [leadStory, ...briefStories] = group.stories;
          sectionContent = `${renderStory(leadStory, {deckClass: 'section-deck', storyId: getStoryId(leadStory.headline)})}<div class="section-briefs">${briefStories.map(story => renderStory(story, {deckClass: 'section-deck', storyId: getStoryId(story.headline)})).join('')}</div>`;
        } else if (group.className === 'lower-page-grid') {
          const columns = [[], [], []];
          group.stories.forEach((story, index) => {
            const column = Number.isInteger(story.layoutColumn) ? story.layoutColumn : index === 0 ? 0 : ((index - 1) % 2) + 1;
            columns[column].push(story);
          });
          sectionContent = columns.map((stories, index) => `<div class="lower-page-column${index === 1 ? ' center-border' : ''}">${stories.map(story => renderStory(story, {deckClass: 'section-deck', storyId: getStoryId(story.headline)})).join('')}</div>`).join('');
        } else {
          sectionContent = group.stories.map(story => renderStory(story, {deckClass: 'section-deck', storyId: getStoryId(story.headline)})).join('');
        }
        const section = `<section class="${sectionClass}"${ariaLabel}>${sectionContent}</section>`;
        return `<div class="fold-separator ${group.className.startsWith('news-section') ? 'section-divider' : ''}"><span class="fold-text">${escapeHtml(group.separator)}</span></div>${section}`;
      }).join('');

      document.getElementById('newspaper').innerHTML = `
        <header class="newspaper-header">
          <div class="header-ears">
            <div class="ear-box left-ear"><span class="ear-label">${escapeHtml(page.weatherLabel)}</span><span class="ear-data">${escapeHtml(page.weatherSummary)}</span></div>
            <div class="ear-box center-motto"><span>"${escapeHtml(page.motto)}"</span></div>
            <div class="ear-box right-ear"><span class="ear-label">${escapeHtml(page.editionLabel)}</span><span class="ear-data">${escapeHtml(page.editionSummary)}</span></div>
          </div>
          <div class="masthead-wrapper"><h1 class="masthead-title">${escapeHtml(page.masthead)}</h1><p class="masthead-tagline">${escapeHtml(page.tagline)} • Established ${escapeHtml(page.established)}</p></div>
          <div class="dateline-bar"><div class="date-item">${escapeHtml(page.edition)}</div><div class="date-item center-date">${escapeHtml(page.dateline)}</div><div class="date-item text-right">${escapeHtml(page.greeting)}</div></div>
        </header>
        <main class="newspaper-body">
          <section class="banner-story" id="${escapeHtml(leadStoryId)}" data-story-id="${escapeHtml(leadStoryId)}" data-source="${escapeHtml(lead.source)}"><h2 class="main-headline">${escapeHtml(lead.headline)}</h2><p class="byline story-byline">BY ${escapeHtml(lead.source)}</p><p class="deck-headline">${escapeHtml(lead.deck)}</p></section>
          <div class="front-page-grid">
            <article class="lead-column">${renderImage({...lead.image, captionHtml: lead.image.caption}, 'press-photo-container')}<div class="lead-text-flow">${leadParagraphs}</div></article>
            <aside class="sidebar-column">
              ${renderStory(sidebarStory, {deckClass: 'side-subhead', subheadClass: 'side-subhead', storyId: getStoryId(sidebarStory.headline)})}
              <div class="index-box"><h4 class="index-title">TODAY'S NEWS INDEX</h4><ul class="index-list">${indexItems}</ul></div>
              <div class="sidebar-item quote-box"><div class="box-inner"><span class="quote-header">${escapeHtml(data.cityWatch.label)}</span><p class="quote-text">${escapeHtml(data.cityWatch.text)}</p><span class="quote-author">${escapeHtml(data.cityWatch.attribution)}</span></div></div>
            </aside>
          </div>
          ${groups}
        </main>
        <footer class="newspaper-footer"><div class="footer-divider"></div><p class="footer-copyright">${escapeHtml(page.footer)}</p></footer>`;
      addShareButtons();
      scrollToStoryFromHash();
    }

    function scrollToStoryFromHash() {
      if (!window.location.hash) return;
      let storyId;
      try { storyId = decodeURIComponent(window.location.hash.slice(1)); }
      catch { return; }
      document.getElementById(storyId)?.scrollIntoView({block: 'start', behavior: 'auto'});
    }

    window.addEventListener('hashchange', scrollToStoryFromHash);

    function addShareButtons() {
      const shareIcon = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5.1 7.1 5.7-2.9M5.1 8.9l5.7 2.9"/><circle cx="3.5" cy="8" r="2"/><circle cx="12.5" cy="3.5" r="2"/><circle cx="12.5" cy="12.5" r="2"/></svg>';
      document.querySelectorAll('.main-headline, .side-headline, .lower-headline, .section-headline').forEach(headline => {
        const button = document.createElement('button');
        button.className = 'share-button'; button.type = 'button'; button.setAttribute('aria-label', `Share: ${headline.textContent.trim()}`); button.title = 'Share this story'; button.innerHTML = shareIcon;
        const defaultLabel = button.getAttribute('aria-label');
        button.addEventListener('click', async () => {
          const title = headline.textContent.trim();
          const storyId = headline.closest('[data-story-id]')?.id;
          if (!storyId) return;
          const storyUrl = new URL(window.location.href);
          storyUrl.hash = storyId;
          const shareData = {title, text: `${title}\n${storyUrl.href}`, url: storyUrl.href};
          try {
            if (navigator?.share) await navigator.share(shareData);
            else {
              const copied = await copyTextToClipboard(shareData.text);
              if (copied) {
                button.title = 'Story title and link copied';
                button.setAttribute('aria-label', `Copied title and link for: ${title}`);
                window.setTimeout(() => { button.title = 'Share this story'; button.setAttribute('aria-label', defaultLabel); }, 1800);
              }
            }
          } catch (error) { if (error.name !== 'AbortError') console.error('Could not share this story:', error); }
        });
        headline.append(button);
      });
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard?.writeText) {
        try { await navigator.clipboard.writeText(text); return true; }
        catch { /* Try the browser's legacy clipboard command below. */ }
      }
      const field = document.createElement('textarea');
      field.value = text;
      field.setAttribute('readonly', '');
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.append(field);
      field.select();
      let copied = false;
      try { copied = document.execCommand('copy'); }
      finally { field.remove(); }
      return copied;
    }

    fetch('/content.json', {cache: 'no-store'})
      .then(response => { if (!response.ok) throw new Error(`Could not load content.json (${response.status})`); return response.json(); })
      .then(renderPage)
      .catch(error => {
        console.error(error);
        document.getElementById('newspaper').innerHTML = '<p class="loading-message" role="alert">Today’s paper could not be loaded. Please check that content.json is available from the web server.</p>';
      });
  </script>
</body>
</html>
